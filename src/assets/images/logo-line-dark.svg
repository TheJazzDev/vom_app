<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background with rounded corners (app store compliant) -->
  <rect width="256" height="256" rx="50" ry="50" fill="#0D0D2B"/>

  <!-- Animated background circles -->
  <g opacity="0.2">
    <circle cx="128" cy="128" r="90" fill="none" stroke="#0084ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 128 128;360 128 128" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="128" r="60" fill="none" stroke="#0084ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="360 128 128;0 128 128" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="128" r="30" fill="none" stroke="#0084ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main text: CSMC -->
  <text x="128" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2px" fill="#0084ff">
    CSMC
  </text>

  <!-- Sub text: VOM -->
  <text x="128" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2px" fill="#0084ff">
    VOM
  </text>

  <!-- Tagline -->
  <text x="128" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="2px" fill="#0084ff" opacity="0.9">
    CONNECT • SERVE • GROW
  </text>
</svg>